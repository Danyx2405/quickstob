<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Quick Stop Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff7e6;--fg:#2a2118;--card:#fff;--ac:#e8590c;--mu:#8a7b6a;--ok:#2b8a3e;--bd:#ead9bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1712;--fg:#f5ead8;--card:#2a231b;--ac:#ff922b;--mu:#a89a86;--ok:#69db7c;--bd:#40372b}}
:root[data-theme="dark"]{--bg:#1c1712;--fg:#f5ead8;--card:#2a231b;--ac:#ff922b;--mu:#a89a86;--ok:#69db7c;--bd:#40372b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{margin:0 0 4px;font-size:26px}.mu{color:var(--mu);font-size:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.4;cursor:default}button.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);margin:6px 0}
.th{font-size:24px;font-weight:700;text-align:center;padding:10px}
.hand{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.l{width:52px;height:68px;border-radius:10px;font-size:28px;font-weight:800;background:var(--bg);color:var(--fg);border:2px solid var(--bd)}
.l.s{border-color:var(--ac);background:var(--ac);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.ok{color:var(--ok);font-weight:700}
</style></head><body><main id="app"></main>
<script>
const L='ABCDEFGILMNOPRSTUVZ'.split('');
const T=['Un animale','Qualcosa che si trova in cucina','Un lavoro','Una città','Un cibo che ami','Una cosa da portare in vacanza','Un frutto','Un cantante o un gruppo','Qualcosa di rotondo','Un personaggio dei cartoni','Una parte del corpo','Un mezzo di trasporto','Una cosa che si trova in bagno','Un film','Uno sport','Qualcosa che fa rumore','Un colore','Un paese','Una cosa che si trova a scuola','Qualcosa di freddo','Una bevanda','Un capo d’abbigliamento','Una scusa per arrivare in ritardo','Uno strumento musicale','Qualcosa che si rompe facilmente','Un nome proprio','Un oggetto nella borsa','Una cosa che si trova in spiaggia','Una verdura','Una marca famosa','Qualcosa che fa paura','Una cosa che si trova in ufficio','Qualcosa che si compra al supermercato','Un fiore o una pianta','Un posto dove nascondersi'];
const rid=()=>Math.random().toString(36).slice(2,9), rl=()=>L[Math.random()*L.length|0];
const app=document.getElementById('app');
let room=null,S=null,code='',sel=null,name='',err='';
let me=rid();try{me=sessionStorage.getItem('qs-id')||me;sessionStorage.setItem('qs-id',me)}catch(e){}
try{name=sessionStorage.getItem('qs-name')||''}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fl=w=>(w||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').charAt(0).toUpperCase();
const pl=id=>S&&S.players.find(p=>p.id===id);

// ---- rete ----
let ws=null;
const act=d=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(Object.assign({id:me},d)))};
function connect(c,create){
  code=c;err='';room=true;S=null;
  const open=()=>{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
    ws.onopen=()=>act({t:'join',room:code,name,create:!!create});create=false;
    ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.error){err=m.error;S=null}else{S=m;err=''}draw()}catch(x){}};
    ws.onclose=()=>setTimeout(open,1500)};
  open();draw();
}
function create(){const c=Math.random().toString(36).slice(2,7);location.hash=c;connect(c,true)}
function joinCode(c){c=c.toLowerCase().replace(/[^a-z0-9]/g,'');if(c){location.hash=c;connect(c,false)}}
function setName(v){name=v.trim().slice(0,16);try{sessionStorage.setItem('qs-name',name)}catch(e){}}

// ---- UI ----
function draw(){
  if(!room){
    app.innerHTML=`<h1>🛑 Quick Stop</h1><div class="mu">Il party game di parole, online. Ispirato a Quick Stop (Asmodee).</div>
    <div class="c"><b>Il tuo nome</b><input id="n" maxlength="16" value="${esc(name)}" placeholder="Es. Daniel">
    <div class="row"><button id="cr">Crea partita</button></div>
    <div class="mu" style="margin-top:8px">oppure entra con un codice</div><input id="cd" placeholder="Codice stanza"><button class="g" id="jn">Entra</button>
    ${err?`<p style="color:var(--ac)">${esc(err)}</p>`:''}</div>
    <div class="c mu"><b>Regole</b><br>Hai 5 lettere. Esce un tema: scrivi in fretta una parola che inizia con una delle tue lettere. Solo i primi 3 giocatori di ogni round rispondono e scartano la lettera. Parola dubbia? Se più di metà degli altri la contesta, la lettera ti torna in mano. Vince chi finisce per primo le carte.</div>`;
    const n=document.getElementById('n');n.oninput=()=>setName(n.value);
    document.getElementById('cr').onclick=()=>{setName(n.value);if(!name)return n.focus();create()};
    document.getElementById('jn').onclick=()=>{setName(n.value);if(!name)return n.focus();joinCode(document.getElementById('cd').value||location.hash.slice(1))};
    return}
  if(!S){app.innerHTML=`<h1>🛑 Quick Stop</h1><div class="c">${err?esc(err):'In attesa dell’host…'}</div>`;return}
  const link=location.href.split('#')[0]+'#'+code,mp=pl(me),pp=S.players.map(p=>`<div class="row"><span>${esc(p.name)}${p.id===S.host?' 👑':''}${p.id===me?' (tu)':''}</span><span class="mu">${S.phase==='lobby'?'':p.n+' carte'}</span></div>`).join('');
  let h=`<h1>🛑 Quick Stop</h1><div class="mu">Stanza <b>${esc(code)}</b> · <a href="#" id="cp" style="color:var(--ac)">copia link</a></div>`;
  if(S.phase==='lobby'){
    h+=`<div class="c"><b>Giocatori (${S.players.length}/7)</b>${pp}</div>`;
    h+=me===S.host?`<button id="st" ${S.players.length<2?'disabled':''}>Inizia (servono almeno 2)</button>`:`<div class="mu">Aspetta che l’host inizi la partita…</div>`;
  }else if(S.phase==='over'){
    h+=`<div class="c th">🏆 ${esc(S.winner)} ha vinto!</div><div class="c">${pp}</div>`;
    if(me===S.host)h+=`<button id="ag">Nuova partita</button>`;
  }else{
    const done=S.claims.some(c=>c.pid===me),full=S.claims.length>=3;
    h+=`<div class="c"><div class="mu" style="text-align:center">Round ${S.round}</div><div class="th">${esc(S.theme)}</div></div>`;
    h+=`<div class="c"><b>La tua mano</b><div class="hand">${(mp?mp.hand:[]).map(x=>`<button class="l ${x===sel?'s':''}" data-l="${x}">${x}</button>`).join('')||'<span class="ok">Hai finito le carte! 🎉</span>'}</div>
    <input id="w" placeholder="${sel?'Parola con la '+sel:'Scegli una lettera'}" autocomplete="off" ${done||full||!sel?'disabled':''}>
    <button id="go" ${done||full||!sel?'disabled':''}>Rispondi</button>
    <div class="mu">${done?'Hai già risposto in questo round.':full?'Round chiuso: ultimo momento per contestare!':'Corri: prima di tutti!'}</div></div>`;
    h+=`<div class="c"><b>Risposte (${S.claims.length}/3)</b>${S.claims.map(c=>{const p=pl(c.pid);return `<div class="row"><span><b>${c.letter}</b> · ${esc(c.word)} <span class="mu">— ${esc(p?p.name:'?')}</span></span>${c.pid===me?'':`<button class="g" data-k="${c.k}" ${c.votes.includes(me)?'disabled':''}>Contesta${c.votes.length?' ('+c.votes.length+')':''}</button>`}</div>`}).join('')||'<span class="mu">Nessuna ancora…</span>'}</div>`;
    h+=`<div class="c"><b>Giocatori</b>${pp}</div>`;
    if(me===S.host)h+=`<button class="g" id="sk">Cambia tema</button>`;
  }
  const keep=document.getElementById('w')?.value,foc=document.activeElement&&document.activeElement.id==='w';
  app.innerHTML=h+(err?`<p>${esc(err)}</p>`:'');
  const w=document.getElementById('w');if(w){w.value=keep||'';if(foc)w.focus();
    const go=()=>{act({t:'claim',letter:sel,word:w.value});w.value='';sel=null};
    document.getElementById('go').onclick=go;w.onkeydown=e=>{if(e.key==='Enter')go()}}
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{sel=b.dataset.l;draw();const x=document.getElementById('w');x&&x.focus()});
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>act({t:'contest',k:b.dataset.k}));
  const q=id=>document.getElementById(id);
  q('cp')&&(q('cp').onclick=e=>{e.preventDefault();try{navigator.clipboard.writeText(link);q('cp').textContent='copiato!'}catch(x){prompt('Copia il link',link)}});
  q('st')&&(q('st').onclick=()=>act({t:'start'}));q('ag')&&(q('ag').onclick=()=>act({t:'again'}));q('sk')&&(q('sk').onclick=()=>act({t:'skip'}));
}
draw();
const h0=location.hash.slice(1);if(h0&&name)connect(h0,false);
</script></body></html>
